<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" role="img" aria-labelledby="t d" font-family="Inter, Helvetica, Arial, sans-serif">
  <title id="t">Three ways to get bytes from a file server to many clients</title>
  <desc id="d">Panel A: four clients all mount one NAS head, so every byte crosses that one controller. Panel B: one client spreads a single mount over many connections to several protocol nodes that share back-end media, as with nconnect and VAST's multipath NFS client. Panel C: pNFS or a proprietary parallel client asks a metadata server for a layout over a thin control path, then reads and writes several data servers directly over thick data paths.</desc>
  <rect x="0" y="0" width="1000" height="600" fill="#FFFFFF"/>

  <text x="30" y="36" font-size="20" font-weight="700" fill="#222222">Parallel file access: from one head to many data paths</text>
  <text x="30" y="58" font-size="13" fill="#555555">Logical view, not to scale. Original drawing for the Everpure Tech Atlas, Chapter 8.</text>

  <!-- Panel frames -->
  <rect x="20" y="76" width="310" height="440" rx="8" fill="#F7F9FB" stroke="#DDDDDD"/>
  <rect x="345" y="76" width="310" height="440" rx="8" fill="#F7F9FB" stroke="#DDDDDD"/>
  <rect x="670" y="76" width="310" height="440" rx="8" fill="#F7F9FB" stroke="#DDDDDD"/>

  <text x="175" y="102" font-size="15" font-weight="700" text-anchor="middle" fill="#222222">A. Single head</text>
  <text x="175" y="121" font-size="12" text-anchor="middle" fill="#555555">NFSv3 / NFSv4 / SMB to one server IP</text>
  <text x="500" y="102" font-size="15" font-weight="700" text-anchor="middle" fill="#222222">B. Many paths, shared back end</text>
  <text x="500" y="121" font-size="12" text-anchor="middle" fill="#555555">nconnect, RDMA, client multipath</text>
  <text x="825" y="102" font-size="15" font-weight="700" text-anchor="middle" fill="#222222">C. Layout, then direct I/O</text>
  <text x="825" y="121" font-size="12" text-anchor="middle" fill="#555555">pNFS, Lustre, GPFS, WEKA</text>

  <!-- Panel A: clients -->
  <g font-size="12" fill="#222222" text-anchor="middle">
    <rect x="35" y="140" width="64" height="34" rx="4" fill="#FFFFFF" stroke="#888888"/><text x="67" y="162">Client</text>
    <rect x="107" y="140" width="64" height="34" rx="4" fill="#FFFFFF" stroke="#888888"/><text x="139" y="162">Client</text>
    <rect x="179" y="140" width="64" height="34" rx="4" fill="#FFFFFF" stroke="#888888"/><text x="211" y="162">Client</text>
    <rect x="251" y="140" width="64" height="34" rx="4" fill="#FFFFFF" stroke="#888888"/><text x="283" y="162">Client</text>
  </g>
  <g stroke="#0072B2" stroke-width="4" fill="none">
    <line x1="67" y1="174" x2="160" y2="270"/>
    <line x1="139" y1="174" x2="168" y2="270"/>
    <line x1="211" y1="174" x2="182" y2="270"/>
    <line x1="283" y1="174" x2="190" y2="270"/>
  </g>
  <rect x="85" y="270" width="180" height="60" rx="6" fill="#FFFFFF" stroke="#D55E00" stroke-width="3"/>
  <text x="175" y="295" font-size="14" font-weight="700" text-anchor="middle" fill="#222222">NAS head</text>
  <text x="175" y="315" font-size="12" text-anchor="middle" fill="#D55E00">every byte crosses here</text>
  <line x1="175" y1="330" x2="175" y2="380" stroke="#0072B2" stroke-width="4"/>
  <rect x="60" y="380" width="230" height="44" rx="6" fill="#E8F1F8" stroke="#888888"/>
  <text x="175" y="407" font-size="13" text-anchor="middle" fill="#222222">Drives behind the head</text>
  <text x="175" y="455" font-size="12" text-anchor="middle" fill="#222222">Simple, standard, stateless (v3).</text>
  <text x="175" y="474" font-size="12" text-anchor="middle" fill="#222222">Ceiling = one controller's CPU,</text>
  <text x="175" y="493" font-size="12" text-anchor="middle" fill="#222222">NICs and memory bandwidth.</text>

  <!-- Panel B -->
  <rect x="440" y="140" width="120" height="34" rx="4" fill="#FFFFFF" stroke="#888888"/>
  <text x="500" y="162" font-size="12" text-anchor="middle" fill="#222222">One GPU server</text>
  <g stroke="#0072B2" stroke-width="2.5" fill="none">
    <line x1="455" y1="174" x2="390" y2="270"/><line x1="465" y1="174" x2="398" y2="270"/>
    <line x1="480" y1="174" x2="460" y2="270"/><line x1="490" y1="174" x2="468" y2="270"/>
    <line x1="510" y1="174" x2="532" y2="270"/><line x1="520" y1="174" x2="540" y2="270"/>
    <line x1="535" y1="174" x2="602" y2="270"/><line x1="545" y1="174" x2="610" y2="270"/>
  </g>
  <g font-size="12" fill="#222222" text-anchor="middle">
    <rect x="360" y="270" width="66" height="44" rx="4" fill="#FFFFFF" stroke="#E69F00" stroke-width="2"/><text x="393" y="290">Protocol</text><text x="393" y="306">node</text>
    <rect x="431" y="270" width="66" height="44" rx="4" fill="#FFFFFF" stroke="#E69F00" stroke-width="2"/><text x="464" y="290">Protocol</text><text x="464" y="306">node</text>
    <rect x="502" y="270" width="66" height="44" rx="4" fill="#FFFFFF" stroke="#E69F00" stroke-width="2"/><text x="535" y="290">Protocol</text><text x="535" y="306">node</text>
    <rect x="573" y="270" width="66" height="44" rx="4" fill="#FFFFFF" stroke="#E69F00" stroke-width="2"/><text x="606" y="290">Protocol</text><text x="606" y="306">node</text>
  </g>
  <g stroke="#888888" stroke-width="1.5" fill="none">
    <line x1="393" y1="314" x2="393" y2="380"/><line x1="464" y1="314" x2="464" y2="380"/>
    <line x1="535" y1="314" x2="535" y2="380"/><line x1="606" y1="314" x2="606" y2="380"/>
  </g>
  <rect x="360" y="380" width="279" height="44" rx="6" fill="#E8F1F8" stroke="#888888"/>
  <text x="500" y="400" font-size="12" text-anchor="middle" fill="#222222">Shared media or east-west fabric</text>
  <text x="500" y="416" font-size="12" text-anchor="middle" fill="#222222">(any node can serve any file)</text>
  <text x="500" y="455" font-size="12" text-anchor="middle" fill="#222222">Standard wire protocol; one mount</text>
  <text x="500" y="474" font-size="12" text-anchor="middle" fill="#222222">uses many NICs and server IPs.</text>
  <text x="500" y="493" font-size="12" text-anchor="middle" fill="#222222">Data still makes a server hop.</text>

  <!-- Panel C -->
  <g font-size="12" fill="#222222" text-anchor="middle">
    <rect x="690" y="140" width="64" height="34" rx="4" fill="#FFFFFF" stroke="#888888"/><text x="722" y="162">Client</text>
    <rect x="762" y="140" width="64" height="34" rx="4" fill="#FFFFFF" stroke="#888888"/><text x="794" y="162">Client</text>
    <rect x="834" y="140" width="64" height="34" rx="4" fill="#FFFFFF" stroke="#888888"/><text x="866" y="162">Client</text>
  </g>
  <rect x="906" y="196" width="66" height="60" rx="6" fill="#FFFFFF" stroke="#CC79A7" stroke-width="2.5"/>
  <text x="939" y="220" font-size="12" font-weight="700" text-anchor="middle" fill="#222222">Metadata</text>
  <text x="939" y="238" font-size="12" font-weight="700" text-anchor="middle" fill="#222222">server</text>
  <g stroke="#CC79A7" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
    <line x1="754" y1="160" x2="906" y2="214"/>
    <line x1="826" y1="166" x2="906" y2="222"/>
    <line x1="898" y1="168" x2="910" y2="198"/>
  </g>
  <g stroke="#009E73" stroke-width="3.5" fill="none">
    <line x1="712" y1="174" x2="712" y2="300"/><line x1="722" y1="174" x2="776" y2="300"/><line x1="732" y1="174" x2="840" y2="300"/>
    <line x1="784" y1="174" x2="720" y2="300"/><line x1="794" y1="174" x2="784" y2="300"/><line x1="804" y1="174" x2="848" y2="300"/>
    <line x1="856" y1="174" x2="728" y2="300"/><line x1="866" y1="174" x2="792" y2="300"/><line x1="876" y1="174" x2="856" y2="300"/>
    <line x1="740" y1="174" x2="896" y2="300"/><line x1="812" y1="174" x2="904" y2="300"/><line x1="884" y1="174" x2="912" y2="300"/>
  </g>
  <g font-size="12" fill="#222222" text-anchor="middle">
    <rect x="688" y="300" width="58" height="60" rx="4" fill="#FFFFFF" stroke="#009E73" stroke-width="2"/><text x="717" y="326">Data</text><text x="717" y="342">server</text>
    <rect x="752" y="300" width="58" height="60" rx="4" fill="#FFFFFF" stroke="#009E73" stroke-width="2"/><text x="781" y="326">Data</text><text x="781" y="342">server</text>
    <rect x="816" y="300" width="58" height="60" rx="4" fill="#FFFFFF" stroke="#009E73" stroke-width="2"/><text x="845" y="326">Data</text><text x="845" y="342">server</text>
    <rect x="880" y="300" width="58" height="60" rx="4" fill="#FFFFFF" stroke="#009E73" stroke-width="2"/><text x="909" y="326">Data</text><text x="909" y="342">server</text>
  </g>
  <line x1="939" y1="256" x2="909" y2="300" stroke="#CC79A7" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="825" y="390" font-size="12" text-anchor="middle" fill="#555555">metadata server tracks health and recalls layouts</text>
  <text x="825" y="455" font-size="12" text-anchor="middle" fill="#222222">Client does the striping math and</text>
  <text x="825" y="474" font-size="12" text-anchor="middle" fill="#222222">talks to every data server directly.</text>
  <text x="825" y="493" font-size="12" text-anchor="middle" fill="#222222">No head in the data path.</text>

  <!-- Legend -->
  <line x1="40" y1="552" x2="90" y2="552" stroke="#0072B2" stroke-width="4"/>
  <text x="98" y="556" font-size="12" fill="#222222">Data path through a server</text>
  <line x1="300" y1="552" x2="350" y2="552" stroke="#009E73" stroke-width="4"/>
  <text x="358" y="556" font-size="12" fill="#222222">Direct data path to data servers</text>
  <line x1="590" y1="552" x2="640" y2="552" stroke="#CC79A7" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="648" y="556" font-size="12" fill="#222222">Metadata / layout (control) path</text>
  <rect x="40" y="570" width="18" height="14" fill="#FFFFFF" stroke="#D55E00" stroke-width="2.5"/>
  <text x="66" y="582" font-size="12" fill="#222222">Bottleneck</text>
</svg>
