<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" width="1000" role="img" aria-labelledby="t d" font-family="Inter, Helvetica, Arial, sans-serif">
  <title id="t">The storage stack, layer by layer, and where each architecture puts its intelligence</title>
  <desc id="d">Eight layers from application down to media, with eight architecture columns: DAS, SAN array, NAS filer, shared-nothing, DASE, parallel file system, object and HCI. Filled blue dots mark the layer holding the main data-services intelligence, orange rings mark secondary intelligence, grey dots mark layers that are present but commodity or pass-through, and dashes mark absent layers. A blue dashed box marks layers 6 to 8, which Everpure owns end to end with Purity and DirectFlash.</desc>
  <rect x="0" y="0" width="1000" height="790" fill="#FFFFFF"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#222222">The storage stack: eight layers, and where each architecture puts the intelligence</text>
  <text x="30" y="58" font-size="13" fill="#555555">Logical view. Intelligence = placement, protection, data reduction and metadata. Original drawing for the Everpure Tech Atlas, Chapter 13.</text>
  <text x="472" y="102" font-size="13" font-weight="700" text-anchor="middle" fill="#222222">DAS</text>
  <text x="536" y="102" font-size="13" font-weight="700" text-anchor="middle" fill="#222222">SAN</text>
  <text x="536" y="119" font-size="13" font-weight="700" text-anchor="middle" fill="#222222">array</text>
  <text x="600" y="102" font-size="13" font-weight="700" text-anchor="middle" fill="#222222">NAS</text>
  <text x="600" y="119" font-size="13" font-weight="700" text-anchor="middle" fill="#222222">filer</text>
  <text x="664" y="102" font-size="13" font-weight="700" text-anchor="middle" fill="#222222">Shared-</text>
  <text x="664" y="119" font-size="13" font-weight="700" text-anchor="middle" fill="#222222">nothing</text>
  <text x="728" y="102" font-size="13" font-weight="700" text-anchor="middle" fill="#222222">DASE</text>
  <text x="792" y="102" font-size="13" font-weight="700" text-anchor="middle" fill="#222222">Parallel</text>
  <text x="792" y="119" font-size="13" font-weight="700" text-anchor="middle" fill="#222222">FS</text>
  <text x="856" y="102" font-size="13" font-weight="700" text-anchor="middle" fill="#222222">Object</text>
  <text x="920" y="102" font-size="13" font-weight="700" text-anchor="middle" fill="#222222">HCI</text>
  <text x="40" y="118" font-size="13" font-weight="700" fill="#555555">LAYER (path of a write, top to bottom)</text>
  <rect x="30" y="150" width="922" height="64" fill="#F3F6F9" stroke="#DDDDDD"/>
  <text x="44" y="177" font-size="15" font-weight="700" fill="#222222">1  Application</text>
  <text x="44" y="198" font-size="12" fill="#555555">Database, hypervisor, AI training job</text>
  <rect x="30" y="214" width="922" height="64" fill="#FFFFFF" stroke="#DDDDDD"/>
  <text x="44" y="241" font-size="15" font-weight="700" fill="#222222">2  File system / object API</text>
  <text x="44" y="262" font-size="12" fill="#555555">XFS, NTFS, NFS namespace, S3 bucket and key</text>
  <rect x="30" y="278" width="922" height="64" fill="#F3F6F9" stroke="#DDDDDD"/>
  <text x="44" y="305" font-size="15" font-weight="700" fill="#222222">3  Volume manager</text>
  <text x="44" y="326" font-size="12" fill="#555555">LVM, software RAID, hypervisor storage layer</text>
  <rect x="30" y="342" width="922" height="64" fill="#FFFFFF" stroke="#DDDDDD"/>
  <text x="44" y="369" font-size="15" font-weight="700" fill="#222222">4  Protocol</text>
  <text x="44" y="390" font-size="12" fill="#555555">SCSI, NVMe, NFS / SMB, S3</text>
  <rect x="30" y="406" width="922" height="64" fill="#F3F6F9" stroke="#DDDDDD"/>
  <text x="44" y="433" font-size="15" font-weight="700" fill="#222222">5  Network</text>
  <text x="44" y="454" font-size="12" fill="#555555">PCIe slot, Fibre Channel, Ethernet, InfiniBand</text>
  <rect x="30" y="470" width="922" height="64" fill="#FFFFFF" stroke="#DDDDDD"/>
  <text x="44" y="497" font-size="15" font-weight="700" fill="#222222">6  Array controller software</text>
  <text x="44" y="518" font-size="12" fill="#555555">Placement, RAID / EC, snapshots, reduction</text>
  <rect x="30" y="534" width="922" height="64" fill="#F3F6F9" stroke="#DDDDDD"/>
  <text x="44" y="561" font-size="15" font-weight="700" fill="#222222">7  SSD controller / FTL</text>
  <text x="44" y="582" font-size="12" fill="#555555">Logical-to-physical map, wear leveling, GC</text>
  <rect x="30" y="598" width="922" height="64" fill="#FFFFFF" stroke="#DDDDDD"/>
  <text x="44" y="625" font-size="15" font-weight="700" fill="#222222">8  Media</text>
  <text x="44" y="646" font-size="12" fill="#555555">NAND dies, SCM, disk platters</text>
