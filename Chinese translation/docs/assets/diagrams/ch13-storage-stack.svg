  <text x="385" y="671" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">Everpure owns 6 to 8</text>
  <circle cx="44" cy="692" r="10" fill="#0072B2"/><text x="62" y="697" font-size="13" fill="#222222">Main intelligence</text>
  <circle cx="210" cy="692" r="8" fill="#FFFFFF" stroke="#E69F00" stroke-width="4"/><text x="226" y="697" font-size="13" fill="#222222">Secondary intelligence</text>
  <circle cx="400" cy="692" r="5" fill="#999999"/><text x="414" y="697" font-size="13" fill="#222222">Present, commodity or pass-through</text>
  <line x1="650" y1="692" x2="668" y2="692" stroke="#999999" stroke-width="2"/><text x="676" y="697" font-size="13" fill="#222222">Layer absent</text>
  <text x="30" y="724" font-size="12" fill="#222222">Everpure: Purity array software also manages raw NAND in DirectFlash modules, so layers 6, 7 and 8 are one design.</text>
  <text x="30" y="743" font-size="12" fill="#222222">Most array vendors stop at layer 6 and buy standard SSDs; software-only vendors (Ceph, WEKA, HCI) run layer 6 on commodity servers.</text>
  <text x="30" y="762" font-size="12" fill="#222222">DAS has no array layer: the host file system and volume manager do the work. HCI runs layer 6 inside the hypervisor (shown at layer 3).</text>
</svg>
