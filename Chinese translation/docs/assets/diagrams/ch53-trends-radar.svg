<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" role="img" aria-labelledby="t d" font-family="Inter, Helvetica, Arial, sans-serif">
  <title id="t">Future-trends radar for storage, 2026 to 2032</title>
  <desc id="d">A radar of twelve storage trends. Concentric rings from the centre outward are: adopt now, 2027 to 2028, 2029 to 2032, and watch. Four quadrants group the trends: media (top left), interconnect and architecture (top right), data services (bottom right), and deployment and operating models (bottom left). Each trend is a numbered dot coloured by likelihood: blue high, orange medium, pink low. HDD persistence, disaggregation and sovereign AI sit in adopt now; larger flash modules, KV cache tiers, data-management convergence, object over RDMA and AI-driven operations sit in 2027 to 2028; PLC and very high layer counts, CXL pooling and co-packaged optics sit in 2029 to 2032; DNA, glass and ceramic archives sit in watch.</desc>
  <rect x="0" y="0" width="1000" height="800" fill="#FFFFFF"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#222222">Storage future-trends radar, 2026–2032</text>
  <text x="30" y="58" font-size="13" fill="#555555">Ring = when the trend becomes material to storage buying decisions; colour = likelihood. Author judgment as of 2026-11-01, not a vendor roadmap.</text>
