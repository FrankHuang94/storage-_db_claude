  <text x="736" y="546" font-size="12" fill="#222222">Low: under 40%</text>
  <text x="30" y="782" font-size="12" fill="#555555">Original drawing for the Everpure Tech Atlas, Chapter 53. Placement is the author's judgment from public roadmaps and forecasts cited in the chapter.</text>
