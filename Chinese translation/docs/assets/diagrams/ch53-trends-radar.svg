  <text x="712" y="128" font-size="13" font-weight="700" fill="#555555">Media</text>
  <circle cx="721" cy="144" r="9" fill="#0072B2"/>
  <text x="721" y="148" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="736" y="148" font-size="12" fill="#222222">Larger flash modules (300 TB to 1 PB)</text>
