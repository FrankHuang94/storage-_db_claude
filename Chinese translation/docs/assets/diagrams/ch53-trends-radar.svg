  <text x="736" y="256" font-size="12" fill="#222222">CXL memory pooling and tiers</text>
  <circle cx="721" cy="272" r="9" fill="#0072B2"/>
  <text x="721" y="276" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
  <text x="736" y="276" font-size="12" fill="#222222">Disaggregation and DPU-hosted storage</text>
  <circle cx="721" cy="292" r="9" fill="#E69F00"/>
  <text x="721" y="296" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">6</text>
  <text x="736" y="296" font-size="12" fill="#222222">Co-packaged optics in storage fabrics</text>
  <circle cx="721" cy="312" r="9" fill="#0072B2"/>
  <text x="721" y="316" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">7</text>
  <text x="736" y="316" font-size="12" fill="#222222">KV cache as a context-memory tier</text>
  <text x="712" y="344" font-size="13" font-weight="700" fill="#555555">Data services</text>
  <circle cx="721" cy="360" r="9" fill="#0072B2"/>
