  <text x="370" y="544.0" font-size="12" text-anchor="middle" fill="#222222">2027–28</text>
  <rect x="338.0" y="611.0" width="64" height="18" rx="3" fill="#FFFFFF" stroke="#888888" stroke-width="0.8"/>
