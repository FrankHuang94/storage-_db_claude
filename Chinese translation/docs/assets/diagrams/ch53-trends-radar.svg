  <text x="721" y="208" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">11</text>
  <text x="736" y="208" font-size="12" fill="#222222">DNA, glass and ceramic archives</text>
  <text x="712" y="236" font-size="13" font-weight="700" fill="#555555">Interconnect and architecture</text>
  <circle cx="721" cy="252" r="9" fill="#E69F00"/>
