  <g id="text_28">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(7.2 384.04202)">Spec dates: PCI-SIG releases (2010-11-18, Oct 2017, 2019-05-29, 2022-01-11, 2025-06-11); PCIe 8.0 is a 2028 target. GB/s = worked arithmetic: lanes x GT/s x encoding efficiency / 8</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(7.2 393.644207)">(128/130 for Gen3-5; 236/256 TLP bytes per FLIT for Gen6+, an upper bound). Data: data/ch12_pcie_bandwidth.csv</text>
  </g>
