<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" role="img" aria-labelledby="t d" font-family="Inter, Helvetica, Arial, sans-serif">
  <title id="t">Shared-nothing cluster: every node owns its CPU, memory and drives</title>
  <desc id="d">Clients connect over a front-end network to any of N identical nodes. Each node contains CPUs, DRAM cache, an NVRAM or journal device, a network card and its own set of NVMe SSDs that only that node can access. Nodes are joined by a separate back-end (east-west) network that carries replication, erasure-coded fragments, rebalancing and rebuild traffic. A small set of nodes also runs a quorum service that holds the authoritative cluster map. Adding a node adds compute, cache, capacity and network ports together.</desc>
  <rect x="0" y="0" width="1000" height="640" fill="#FFFFFF"/>

  <text x="30" y="36" font-size="20" font-weight="700" fill="#222222">Shared-nothing cluster: each node owns its CPU, memory and drives</text>
  <text x="30" y="58" font-size="13" fill="#555555">Logical view, not to scale. Original drawing for the Everpure Tech Atlas, Chapter 15.</text>

  <!-- Clients -->
  <rect x="30" y="74" width="940" height="44" rx="6" fill="#F3F6F9" stroke="#888888"/>
  <text x="500" y="101" font-size="14" text-anchor="middle" fill="#222222">Clients: GPU servers, app hosts, VMs (NFS, SMB, S3, block or a native client)</text>

  <!-- Front-end network -->
  <rect x="30" y="130" width="940" height="26" rx="4" fill="#DDDDDD"/>
  <text x="500" y="148" font-size="13" text-anchor="middle" fill="#222222">Front-end network (north-south): a client can connect to any node</text>

  <!-- connectors front-end to nodes -->
  <g stroke="#888888" stroke-width="1.5">
    <line x1="120" y1="156" x2="120" y2="176"/><line x1="350" y1="156" x2="350" y2="176"/>
    <line x1="580" y1="156" x2="580" y2="176"/><line x1="860" y1="156" x2="860" y2="176"/>
  </g>

  <!-- Node template x4 -->
  <g>
    <rect x="30" y="176" width="180" height="300" rx="8" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
    <text x="120" y="200" font-size="15" font-weight="700" text-anchor="middle" fill="#0072B2">Node 1</text>
    <rect x="45" y="212" width="150" height="34" rx="4" fill="#0072B2"/><text x="120" y="234" font-size="13" text-anchor="middle" fill="#FFFFFF">CPU cores</text>
    <rect x="45" y="252" width="72" height="30" rx="4" fill="#56B4E9"/><text x="81" y="272" font-size="12" text-anchor="middle" fill="#222222">DRAM</text>
    <rect x="123" y="252" width="72" height="30" rx="4" fill="#F0E442"/><text x="159" y="272" font-size="12" text-anchor="middle" fill="#222222">NVRAM</text>
    <g fill="#009E73"><rect x="45" y="292" width="34" height="52" rx="3"/><rect x="84" y="292" width="34" height="52" rx="3"/><rect x="123" y="292" width="34" height="52" rx="3"/><rect x="162" y="292" width="34" height="52" rx="3"/>
    <rect x="45" y="350" width="34" height="52" rx="3"/><rect x="84" y="350" width="34" height="52" rx="3"/><rect x="123" y="350" width="34" height="52" rx="3"/><rect x="162" y="350" width="34" height="52" rx="3"/></g>
    <text x="120" y="424" font-size="12" text-anchor="middle" fill="#222222">local NVMe SSDs</text>
    <text x="120" y="440" font-size="12" text-anchor="middle" fill="#222222">(owned by this node)</text>
    <rect x="70" y="448" width="100" height="20" rx="3" fill="#D55E00"/><text x="120" y="463" font-size="12" text-anchor="middle" fill="#FFFFFF">quorum member</text>
  </g>
  <g>
    <rect x="260" y="176" width="180" height="300" rx="8" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
    <text x="350" y="200" font-size="15" font-weight="700" text-anchor="middle" fill="#0072B2">Node 2</text>
    <rect x="275" y="212" width="150" height="34" rx="4" fill="#0072B2"/><text x="350" y="234" font-size="13" text-anchor="middle" fill="#FFFFFF">CPU cores</text>
    <rect x="275" y="252" width="72" height="30" rx="4" fill="#56B4E9"/><text x="311" y="272" font-size="12" text-anchor="middle" fill="#222222">DRAM</text>
    <rect x="353" y="252" width="72" height="30" rx="4" fill="#F0E442"/><text x="389" y="272" font-size="12" text-anchor="middle" fill="#222222">NVRAM</text>
    <g fill="#009E73"><rect x="275" y="292" width="34" height="52" rx="3"/><rect x="314" y="292" width="34" height="52" rx="3"/><rect x="353" y="292" width="34" height="52" rx="3"/><rect x="392" y="292" width="34" height="52" rx="3"/>
    <rect x="275" y="350" width="34" height="52" rx="3"/><rect x="314" y="350" width="34" height="52" rx="3"/><rect x="353" y="350" width="34" height="52" rx="3"/><rect x="392" y="350" width="34" height="52" rx="3"/></g>
    <text x="350" y="424" font-size="12" text-anchor="middle" fill="#222222">local NVMe SSDs</text>
    <text x="350" y="440" font-size="12" text-anchor="middle" fill="#222222">(owned by this node)</text>
    <rect x="300" y="448" width="100" height="20" rx="3" fill="#D55E00"/><text x="350" y="463" font-size="12" text-anchor="middle" fill="#FFFFFF">quorum member</text>
  </g>
  <g>
    <rect x="490" y="176" width="180" height="300" rx="8" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
    <text x="580" y="200" font-size="15" font-weight="700" text-anchor="middle" fill="#0072B2">Node 3</text>
    <rect x="505" y="212" width="150" height="34" rx="4" fill="#0072B2"/><text x="580" y="234" font-size="13" text-anchor="middle" fill="#FFFFFF">CPU cores</text>
    <rect x="505" y="252" width="72" height="30" rx="4" fill="#56B4E9"/><text x="541" y="272" font-size="12" text-anchor="middle" fill="#222222">DRAM</text>
    <rect x="583" y="252" width="72" height="30" rx="4" fill="#F0E442"/><text x="619" y="272" font-size="12" text-anchor="middle" fill="#222222">NVRAM</text>
    <g fill="#009E73"><rect x="505" y="292" width="34" height="52" rx="3"/><rect x="544" y="292" width="34" height="52" rx="3"/><rect x="583" y="292" width="34" height="52" rx="3"/><rect x="622" y="292" width="34" height="52" rx="3"/>
    <rect x="505" y="350" width="34" height="52" rx="3"/><rect x="544" y="350" width="34" height="52" rx="3"/><rect x="583" y="350" width="34" height="52" rx="3"/><rect x="622" y="350" width="34" height="52" rx="3"/></g>
    <text x="580" y="424" font-size="12" text-anchor="middle" fill="#222222">local NVMe SSDs</text>
    <text x="580" y="440" font-size="12" text-anchor="middle" fill="#222222">(owned by this node)</text>
    <rect x="530" y="448" width="100" height="20" rx="3" fill="#D55E00"/><text x="580" y="463" font-size="12" text-anchor="middle" fill="#FFFFFF">quorum member</text>
  </g>
  <text x="715" y="330" font-size="22" font-weight="700" text-anchor="middle" fill="#888888">. . .</text>
  <g>
    <rect x="770" y="176" width="180" height="300" rx="8" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
    <text x="860" y="200" font-size="15" font-weight="700" text-anchor="middle" fill="#0072B2">Node N</text>
    <rect x="785" y="212" width="150" height="34" rx="4" fill="#0072B2"/><text x="860" y="234" font-size="13" text-anchor="middle" fill="#FFFFFF">CPU cores</text>
    <rect x="785" y="252" width="72" height="30" rx="4" fill="#56B4E9"/><text x="821" y="272" font-size="12" text-anchor="middle" fill="#222222">DRAM</text>
    <rect x="863" y="252" width="72" height="30" rx="4" fill="#F0E442"/><text x="899" y="272" font-size="12" text-anchor="middle" fill="#222222">NVRAM</text>
    <g fill="#009E73"><rect x="785" y="292" width="34" height="52" rx="3"/><rect x="824" y="292" width="34" height="52" rx="3"/><rect x="863" y="292" width="34" height="52" rx="3"/><rect x="902" y="292" width="34" height="52" rx="3"/>
    <rect x="785" y="350" width="34" height="52" rx="3"/><rect x="824" y="350" width="34" height="52" rx="3"/><rect x="863" y="350" width="34" height="52" rx="3"/><rect x="902" y="350" width="34" height="52" rx="3"/></g>
    <text x="860" y="424" font-size="12" text-anchor="middle" fill="#222222">local NVMe SSDs</text>
    <text x="860" y="440" font-size="12" text-anchor="middle" fill="#222222">(owned by this node)</text>
  </g>

  <!-- connectors nodes to back-end -->
  <g stroke="#D55E00" stroke-width="2">
    <line x1="120" y1="476" x2="120" y2="500"/><line x1="350" y1="476" x2="350" y2="500"/>
    <line x1="580" y1="476" x2="580" y2="500"/><line x1="860" y1="476" x2="860" y2="500"/>
  </g>

  <!-- Back-end network -->
  <rect x="30" y="500" width="940" height="30" rx="4" fill="#FBE3D6" stroke="#D55E00"/>
  <text x="500" y="520" font-size="13" font-weight="700" text-anchor="middle" fill="#222222">Back-end network (east-west): replicas, EC fragments, forwarded I/O, rebalancing, rebuilds</text>

  <!-- Legend / takeaways -->
  <text x="30" y="566" font-size="13" fill="#222222">To read data held on Node 3, a client connected to Node 1 must go through Node 3's CPU: data is never shared, only requested.</text>
  <text x="30" y="590" font-size="13" fill="#222222">The cluster map (which node owns which data) is held by a small odd-numbered quorum (orange) and cached by every node and smart client.</text>
  <text x="30" y="614" font-size="13" fill="#222222">Scaling unit = one whole node: CPU, cache, capacity and network ports are bought together.</text>
</svg>
