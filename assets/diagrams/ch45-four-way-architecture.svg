  <line x1="925" y1="184" x2="925" y2="358" stroke="#222222" stroke-width="5" marker-end="url(#ah)"/>
  <text x="933" y="262" font-size="12" fill="#222222">LNet</text>
  <text x="933" y="278" font-size="12" fill="#222222">RDMA</text>
  <rect x="765" y="360" width="205" height="88" rx="6" fill="#EEEEEE" stroke="#888888"/>
  <text x="867" y="378" font-size="12" font-weight="700" fill="#222222" text-anchor="middle">OSS / OST appliances</text>
  <g fill="#FFFFFF" stroke="#888888">
    <rect x="773" y="388" width="58" height="50" rx="4"/><rect x="838" y="388" width="58" height="50" rx="4"/><rect x="903" y="388" width="58" height="50" rx="4"/>
  </g>
  <g font-size="12" fill="#222222" text-anchor="middle">
    <text x="802" y="409">OSS</text><text x="802" y="425">AI400X</text>
    <text x="867" y="409">OSS</text><text x="867" y="425">AI400X</text>
    <text x="932" y="409">OSS</text><text x="932" y="425">AI400X</text>
  </g>
  <rect x="765" y="460" width="205" height="42" rx="6" fill="#FFFFFF" stroke="#CC79A7" stroke-dasharray="4 3"/>
  <text x="867" y="477" font-size="12" font-weight="700" fill="#222222" text-anchor="middle">+ Infinia KV-store engine</text>
  <text x="867" y="494" font-size="12" fill="#222222" text-anchor="middle">S3, KV cache; via DDN CORE</text>
  <g font-size="12" fill="#222222">
    <text x="767" y="530">Bulk data: 1 hop to OSS</text>
    <text x="767" y="550">Metadata: MDS/MDT, DNE shards</text>
    <text x="767" y="570">Scales: MDS, OSS apart</text>
  </g>

  <!-- Legend -->
  <rect x="20" y="606" width="960" height="46" rx="6" fill="#F3F6F9" stroke="#DDDDDD"/>
  <line x1="36" y1="629" x2="86" y2="629" stroke="#222222" stroke-width="5" marker-end="url(#ah)"/>
  <text x="94" y="633" font-size="12" fill="#222222">bulk data path</text>
  <line x1="200" y1="629" x2="250" y2="629" stroke="#555555" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#am)"/>
  <text x="258" y="633" font-size="12" fill="#222222">metadata operations</text>
  <line x1="390" y1="629" x2="440" y2="629" stroke="#888888" stroke-width="1.2" stroke-dasharray="2 3"/>
  <text x="448" y="633" font-size="12" fill="#222222">control only</text>
  <rect x="545" y="620" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#555555" stroke-dasharray="4 3"/>
  <text x="569" y="633" font-size="12" fill="#222222">up-stack layer or second engine</text>
  <rect x="770" y="620" width="16" height="16" rx="3" fill="#EEEEEE" stroke="#888888"/>
  <text x="794" y="633" font-size="12" fill="#222222">where the bytes live</text>
  <text x="20" y="680" font-size="12" fill="#555555">Hop counts are logical network hops for bulk data, not latency. WEKA's internal hop order is simplified; WEKA does not publish it.</text>
</svg>
