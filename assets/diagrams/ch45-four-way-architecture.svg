<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" role="img" aria-labelledby="t d" font-family="Inter, Helvetica, Arial, sans-serif">
  <title id="t">Four AI-storage architectures side by side: FlashBlade//EXA, VAST, WEKA and DDN</title>
  <desc id="d">Four panels drawn with the same grammar: GPU-server clients at the top, a metadata slot in the middle, the data tier at the bottom, an up-stack or second-engine slot below that, and three summary lines. Thick dark arrows are bulk data; dashed arrows are metadata operations; dotted lines are control. FlashBlade//EXA: stock pNFS clients get layouts from a Purity//FB metadata core on DirectFlash blades, then move data directly over RDMA to Purity//DN data nodes on third-party NVMe servers. VAST: stock NFS clients reach stateless CNodes, which reach DBoxes of SCM and QLC over an all-to-all NVMe-oF fabric; metadata lives in the shared SCM. WEKA: clients run the WEKA driver and hash each operation to a metadata bucket that lives on every backend node; there is no metadata server. DDN EXAScaler: Lustre kernel clients get layouts from the MDS and stream data directly to OSS appliances; Infinia, a separate key-value engine, sits alongside under the DDN CORE control plane.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222222"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="700" fill="#FFFFFF"/>

  <text x="20" y="34" font-size="20" font-weight="700" fill="#222222">Four ways to feed a GPU cluster: same grammar, different splits</text>
  <text x="20" y="56" font-size="13" fill="#555555">Logical view, not to scale. Original drawing for the Everpure Tech Atlas, Chapter 45 (based on Chapters 27, 42, 43 and 44).</text>

