  </g>
  <g id="text_23">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(7.2 384.088508)">Illustrative model, not vendor data. Uniform random single-page writes on a full drive; analytic curve assumes oldest-first cleaning, simulation uses greedy GC (2,048 blocks x 128</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(7.2 393.690695)">pages). Skew = 80% of writes to 20% of LBAs. Excludes wear levelling, refresh, bad blocks, parity and TRIM. Data: data/ch03_waf_op.csv</text>
  </g>
