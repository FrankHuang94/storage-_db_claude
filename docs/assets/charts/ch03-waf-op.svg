    <g id="text_20">
     <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="356.429375" y="125.553972" transform="rotate(-0 356.429375 125.553972)">Analytic: WAF = 1/(1-u), u = exp(-(1-u)(1+OP))</text>
    </g>
