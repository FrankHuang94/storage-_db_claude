   <g id="text_15">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #555555" x="660.35922" y="307.500328" transform="rotate(-0 660.35922 307.500328)">WAF = 1: host writes whole blocks sequentially (log-structured host, ZNS, FDP done well)</text>
