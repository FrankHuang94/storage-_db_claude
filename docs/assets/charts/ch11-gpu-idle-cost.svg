  <g id="text_29">
   <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start" x="7.2" y="17.077969" transform="rotate(-0 7.2 17.077969)">Worked example: what storage stalls cost a 1,024-GPU H100 cluster per year</text>
  </g>
  <g id="text_30">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(7.2 402.879531)">Worked example, not measured data. Idle cost = stall fraction x 1,024 GPUs x 8,760 h x price. Checkpoint = 70B parameters x 16 bytes (bf16 weights + fp32 master + Adam state) = 1.12 TB.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(7.2 412.481719)">Prices: CoreWeave and Lambda on-demand as reported by price trackers, 2026; $2.00 is an illustrative low tier. Data: data/ch11_gpu_idle_cost.csv</text>
  </g>
