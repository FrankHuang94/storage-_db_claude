   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(7.2 384.088469)">Sources: Everpure release via HPCwire (2026-09-02); Microsoft Learn Azure Managed Lustre v3.0 page; NVIDIA AIStore blog (2026-09-01); Alluxio blog (2026-09, search summary only, hatched bar = 405B model, not the 1T-class model);</text>
