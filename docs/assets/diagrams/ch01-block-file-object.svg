<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" role="img" aria-labelledby="t d" font-family="Inter, Helvetica, Arial, sans-serif">
  <title id="t">Block vs file vs object: three ways to address the same bytes</title>
  <desc id="d">Three columns compare storage abstractions. Block storage exposes a volume of numbered fixed-size blocks; the host's file system or database decides what each block means; it is reached over Fibre Channel, iSCSI or NVMe-oF and used by databases and virtual machines. File storage exposes a hierarchical tree of directories and files addressed by path and byte offset; the storage system owns the file system; it is reached over NFS, SMB or parallel file system clients and used by shared home directories, HPC and AI training. Object storage exposes flat buckets of objects addressed by key, each carrying data plus rich metadata; objects are written whole; it is reached over the S3 API on HTTP and used by cloud-native applications, backup targets, data lakes and AI datasets. A bottom band notes that all three end up as blocks on SSDs or HDDs, and an arrow shows the trade from low latency and fine-grained updates toward more metadata and more scale.</desc>
  <rect x="0" y="0" width="1000" height="700" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="30" y="36" font-size="20" font-weight="700" fill="#222222">Block vs file vs object: three ways to address the same bytes</text>
  <text x="30" y="58" font-size="13" fill="#555555">Logical view, not to scale. Original drawing for the Everpure Tech Atlas, Chapter 1.</text>

  <!-- Column headers -->
  <rect x="30" y="76" width="300" height="56" rx="6" fill="#0072B2"/>
  <text x="180" y="100" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">BLOCK</text>
  <text x="180" y="121" font-size="13" fill="#FFFFFF" text-anchor="middle">A volume of numbered blocks</text>

  <rect x="350" y="76" width="300" height="56" rx="6" fill="#009E73"/>
  <text x="500" y="100" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">FILE</text>
  <text x="500" y="121" font-size="13" fill="#FFFFFF" text-anchor="middle">A tree of directories and files</text>

  <rect x="670" y="76" width="300" height="56" rx="6" fill="#E69F00"/>
  <text x="820" y="100" font-size="18" font-weight="700" fill="#222222" text-anchor="middle">OBJECT</text>
  <text x="820" y="121" font-size="13" fill="#222222" text-anchor="middle">Flat buckets of keyed objects</text>

  <!-- Illustration panels -->
  <rect x="30" y="142" width="300" height="200" rx="6" fill="#F3F6F9" stroke="#BBBBBB"/>
  <rect x="350" y="142" width="300" height="200" rx="6" fill="#F3F6F9" stroke="#BBBBBB"/>
  <rect x="670" y="142" width="300" height="200" rx="6" fill="#F3F6F9" stroke="#BBBBBB"/>

  <!-- BLOCK illustration: grid of LBAs -->
  <text x="45" y="164" font-size="12" fill="#555555">LUN 7 (what the host sees as a "disk")</text>
  <g font-size="12" fill="#222222" text-anchor="middle">
    <g fill="#FFFFFF" stroke="#0072B2" stroke-width="1.2">
      <rect x="45" y="174" width="62" height="30"/><rect x="113" y="174" width="62" height="30"/><rect x="181" y="174" width="62" height="30"/><rect x="249" y="174" width="62" height="30"/>
      <rect x="45" y="210" width="62" height="30"/><rect x="113" y="210" width="62" height="30"/><rect x="249" y="210" width="62" height="30"/>
      <rect x="45" y="246" width="62" height="30"/><rect x="113" y="246" width="62" height="30"/><rect x="181" y="246" width="62" height="30"/><rect x="249" y="246" width="62" height="30"/>
    </g>
    <rect x="181" y="210" width="62" height="30" fill="#56B4E9" stroke="#0072B2" stroke-width="1.2"/>
    <text x="76" y="194">LBA 0</text><text x="144" y="194">LBA 1</text><text x="212" y="194">LBA 2</text><text x="280" y="194">LBA 3</text>
    <text x="76" y="230">LBA 4</text><text x="144" y="230">LBA 5</text><text x="212" y="230" font-weight="700">LBA 6</text><text x="280" y="230">LBA 7</text>
    <text x="76" y="266">LBA 8</text><text x="144" y="266">LBA 9</text><text x="212" y="266">LBA 10</text><text x="280" y="266">…</text>
  </g>
  <text x="45" y="300" font-size="12" fill="#222222" font-family="Menlo, Consolas, monospace">WRITE LBA 6, 1 block</text>
  <text x="45" y="320" font-size="12" fill="#555555">No names, no folders: just offsets.</text>

  <!-- FILE illustration: directory tree -->
  <g font-size="13" fill="#222222">
    <text x="365" y="168" font-weight="700">/projects</text>
    <line x1="372" y1="174" x2="372" y2="256" stroke="#009E73" stroke-width="1.5"/>
    <line x1="372" y1="192" x2="390" y2="192" stroke="#009E73" stroke-width="1.5"/>
    <text x="395" y="197">genomics/</text>
    <line x1="372" y1="222" x2="390" y2="222" stroke="#009E73" stroke-width="1.5"/>
    <text x="395" y="227">training/</text>
    <line x1="402" y1="232" x2="402" y2="282" stroke="#009E73" stroke-width="1.5"/>
    <line x1="402" y1="252" x2="420" y2="252" stroke="#009E73" stroke-width="1.5"/>
    <text x="425" y="257">shard-0001.tar</text>
    <line x1="402" y1="278" x2="420" y2="278" stroke="#009E73" stroke-width="1.5"/>
    <text x="425" y="283">shard-0002.tar</text>
  </g>
  <text x="365" y="310" font-size="12" fill="#222222" font-family="Menlo, Consolas, monospace">read(path, offset 4 MB, 1 MB)</text>
  <text x="365" y="330" font-size="12" fill="#555555">Names, permissions, locks, partial edits.</text>

  <!-- OBJECT illustration: bucket with objects -->
  <path d="M690 166 L950 166 L935 282 L705 282 Z" fill="#FFFFFF" stroke="#E69F00" stroke-width="1.5"/>
  <text x="820" y="160" font-size="12" fill="#555555" text-anchor="middle">bucket: training-data</text>
  <g font-size="12" fill="#222222">
    <rect x="712" y="176" width="216" height="46" rx="4" fill="#FFF4E0" stroke="#E69F00"/>
    <text x="720" y="194" font-weight="700">key: img/000123.jpg</text>
    <text x="720" y="212">meta: label=cat  + data</text>
    <rect x="712" y="228" width="216" height="46" rx="4" fill="#FFF4E0" stroke="#E69F00"/>
    <text x="720" y="246" font-weight="700">key: ckpt/step-9000/rank-3</text>
    <text x="720" y="264">meta: model=v4  + data</text>
  </g>
  <text x="685" y="310" font-size="12" fill="#222222" font-family="Menlo, Consolas, monospace">GET training-data/img/000123.jpg</text>
  <text x="685" y="330" font-size="12" fill="#555555">Whole-object PUT and GET over HTTP.</text>

  <!-- Attribute rows -->
  <g font-size="13" fill="#222222">
    <!-- row labels as small caps inside each column -->
    <text x="40" y="372" font-weight="700" fill="#0072B2">Address</text>
    <text x="40" y="390">Device + block number</text>
    <text x="40" y="418" font-weight="700" fill="#0072B2">Who owns the metadata</text>
    <text x="40" y="436">The host: its file system or database</text>
    <text x="40" y="464" font-weight="700" fill="#0072B2">Typical protocols</text>
    <text x="40" y="482">Fibre Channel, iSCSI, NVMe-oF</text>
    <text x="40" y="510" font-weight="700" fill="#0072B2">Typical buyers and workloads</text>
    <text x="40" y="528">DBAs, VM admins: databases,</text>
    <text x="40" y="546">virtual machines, ERP</text>

    <text x="360" y="372" font-weight="700" fill="#009E73">Address</text>
    <text x="360" y="390">Path name + byte offset</text>
    <text x="360" y="418" font-weight="700" fill="#009E73">Who owns the metadata</text>
    <text x="360" y="436">The storage system's file system</text>
    <text x="360" y="464" font-weight="700" fill="#009E73">Typical protocols</text>
    <text x="360" y="482">NFS, SMB, parallel file clients</text>
    <text x="360" y="510" font-weight="700" fill="#009E73">Typical buyers and workloads</text>
    <text x="360" y="528">Research/HPC, media, shared</text>
    <text x="360" y="546">home dirs, AI training</text>

    <text x="680" y="372" font-weight="700" fill="#B87A00">Address</text>
    <text x="680" y="390">Bucket + key (flat namespace)</text>
    <text x="680" y="418" font-weight="700" fill="#B87A00">Who owns the metadata</text>
    <text x="680" y="436">The store: a key-value metadata DB</text>
    <text x="680" y="464" font-weight="700" fill="#B87A00">Typical protocols</text>
    <text x="680" y="482">S3 API over HTTP(S)</text>
    <text x="680" y="510" font-weight="700" fill="#B87A00">Typical buyers and workloads</text>
    <text x="680" y="528">Cloud-native and AI teams: data</text>
    <text x="680" y="546">lakes, backups, datasets</text>
  </g>

  <!-- Trade-off arrow -->
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555555"/>
    </marker>
    <marker id="ahl" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto">
      <path d="M10,0 L0,5 L10,10 Z" fill="#555555"/>
    </marker>
  </defs>
  <line x1="40" y1="578" x2="960" y2="578" stroke="#555555" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ahl)"/>
  <text x="40" y="600" font-size="13" fill="#222222">Lowest latency, small in-place updates</text>
  <text x="960" y="600" font-size="13" fill="#222222" text-anchor="end">Richest metadata, largest scale, cheapest per TB</text>

  <!-- Bottom band -->
  <rect x="30" y="618" width="940" height="56" rx="6" fill="#DDDDDD"/>
  <text x="500" y="642" font-size="14" font-weight="700" fill="#222222" text-anchor="middle">Underneath, all three are stored as blocks on SSDs or HDDs</text>
  <text x="500" y="662" font-size="13" fill="#222222" text-anchor="middle">The abstraction decides who keeps the map from names to blocks, and how big that map gets.</text>
</svg>
