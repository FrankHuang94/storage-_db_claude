<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" role="img" aria-labelledby="t d" font-family="Inter, Helvetica, Arial, sans-serif">
  <title id="t">The memory and storage media hierarchy, HBM to tape</title>
  <desc id="d">A seven-tier pyramid. From top to bottom: HBM, DRAM, CXL memory, local NVMe SSD, networked flash, hard disk and tape. Each tier is slower, larger and cheaper per gigabyte than the one above. Columns give approximate access latency, price per gigabyte and typical capacity per device or system as order-of-magnitude 2026 values. A marked gap of roughly one thousand times in latency separates the memory tiers from the flash tiers.</desc>
  <rect x="0" y="0" width="1000" height="760" fill="#FFFFFF"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#222222">The memory and storage hierarchy: HBM to tape</text>
  <text x="30" y="58" font-size="13" fill="#555555">Order-of-magnitude, 2026. Device- or system-level figures; prices are 2026 contract/street levels during a memory shortage.</text>
  <text x="30" y="76" font-size="13" fill="#555555">Original drawing for the Everpure Tech Atlas, Chapter 2. Sources: see the chapter footnotes.</text>
  <text x="590" y="108" font-size="14" font-weight="700" fill="#222222" text-anchor="middle">Access latency</text>
  <text x="745" y="108" font-size="14" font-weight="700" fill="#222222" text-anchor="middle">$ per GB</text>
  <text x="893" y="108" font-size="14" font-weight="700" fill="#222222" text-anchor="middle">Typical capacity</text>
  <line x1="505" y1="116" x2="975" y2="116" stroke="#888888" stroke-width="1"/>
  <polygon points="224.0,120.0 300.0,120.0 323.0,196.0 201.0,196.0" fill="#D55E00" stroke="#FFFFFF" stroke-width="1"/>
  <text x="262" y="155" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">HBM</text>
  <text x="262" y="172" font-size="12" fill="#FFFFFF" text-anchor="middle">on GPU package</text>
  <line x1="327" y1="199" x2="975" y2="199" stroke="#DDDDDD" stroke-width="1"/>
  <text x="590" y="163" font-size="13" fill="#222222" text-anchor="middle">~100 ns class</text>
  <text x="745" y="163" font-size="13" fill="#222222" text-anchor="middle">~$10–20</text>
  <text x="893" y="163" font-size="13" fill="#222222" text-anchor="middle">~0.1–0.3 TB per GPU</text>
  <polygon points="199.1,202.0 324.9,202.0 347.9,278.0 176.1,278.0" fill="#E69F00" stroke="#FFFFFF" stroke-width="1"/>
  <text x="262" y="237" font-size="15" font-weight="700" fill="#222222" text-anchor="middle">DRAM</text>
  <text x="262" y="255" font-size="12" fill="#222222" text-anchor="middle">DDR5 next to the CPU</text>
  <line x1="352" y1="281" x2="975" y2="281" stroke="#DDDDDD" stroke-width="1"/>
  <text x="590" y="245" font-size="13" fill="#222222" text-anchor="middle">~80–120 ns</text>
  <text x="745" y="245" font-size="13" fill="#222222" text-anchor="middle">~$10–25 (2026 spike)</text>
  <text x="893" y="245" font-size="13" fill="#222222" text-anchor="middle">~0.5–4 TB per server</text>
  <polygon points="174.3,284.0 349.7,284.0 372.8,360.0 151.2,360.0" fill="#F0E442" stroke="#FFFFFF" stroke-width="1"/>
  <text x="262" y="319" font-size="15" font-weight="700" fill="#222222" text-anchor="middle">CXL memory</text>
  <text x="262" y="337" font-size="12" fill="#222222" text-anchor="middle">DRAM behind a PCIe/CXL link</text>
  <line x1="377" y1="363" x2="975" y2="363" stroke="#DDDDDD" stroke-width="1"/>
  <text x="590" y="327" font-size="13" fill="#222222" text-anchor="middle">~200–300 ns</text>
  <text x="745" y="327" font-size="13" fill="#222222" text-anchor="middle">≈ DRAM or less</text>
  <text x="893" y="327" font-size="13" fill="#222222" text-anchor="middle">0.25–16 TB per device</text>
  <polygon points="149.4,366.0 374.6,366.0 397.6,442.0 126.4,442.0" fill="#009E73" stroke="#FFFFFF" stroke-width="1"/>
  <text x="262" y="401" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Local NVMe SSD</text>
  <text x="262" y="419" font-size="12" fill="#FFFFFF" text-anchor="middle">NAND flash in the server</text>
  <line x1="402" y1="445" x2="975" y2="445" stroke="#DDDDDD" stroke-width="1"/>
  <text x="590" y="409" font-size="13" fill="#222222" text-anchor="middle">~50–150 µs read</text>
  <text x="745" y="409" font-size="13" fill="#222222" text-anchor="middle">~$0.10–0.80</text>
  <text x="893" y="409" font-size="13" fill="#222222" text-anchor="middle">8–245 TB per drive</text>
  <polygon points="124.6,448.0 399.4,448.0 422.5,524.0 101.5,524.0" fill="#56B4E9" stroke="#FFFFFF" stroke-width="1"/>
  <text x="262" y="483" font-size="15" font-weight="700" fill="#222222" text-anchor="middle">Networked flash</text>
  <text x="262" y="501" font-size="12" fill="#222222" text-anchor="middle">all-flash array / cluster</text>
  <line x1="426" y1="527" x2="975" y2="527" stroke="#DDDDDD" stroke-width="1"/>
  <text x="590" y="491" font-size="13" fill="#222222" text-anchor="middle">~0.1–1 ms</text>
  <text x="745" y="491" font-size="13" fill="#222222" text-anchor="middle">SSD + system markup</text>
  <text x="893" y="491" font-size="13" fill="#222222" text-anchor="middle">PB to EB per system</text>
  <polygon points="99.7,530.0 424.3,530.0 447.3,606.0 76.7,606.0" fill="#0072B2" stroke="#FFFFFF" stroke-width="1"/>
  <text x="262" y="565" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">HDD</text>
  <text x="262" y="583" font-size="12" fill="#FFFFFF" text-anchor="middle">nearline 7,200 rpm disk</text>
  <line x1="451" y1="609" x2="975" y2="609" stroke="#DDDDDD" stroke-width="1"/>
  <text x="590" y="573" font-size="13" fill="#222222" text-anchor="middle">~5–15 ms random</text>
  <text x="745" y="573" font-size="13" fill="#222222" text-anchor="middle">~$0.015–0.04</text>
  <text x="893" y="573" font-size="13" fill="#222222" text-anchor="middle">30–44 TB per drive</text>
  <polygon points="74.9,612.0 449.1,612.0 472.2,688.0 51.8,688.0" fill="#666666" stroke="#FFFFFF" stroke-width="1"/>
  <text x="262" y="647" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tape</text>
  <text x="262" y="665" font-size="12" fill="#FFFFFF" text-anchor="middle">LTO cartridges in a library</text>
  <text x="590" y="655" font-size="13" fill="#222222" text-anchor="middle">~1 min to first byte</text>
  <text x="745" y="655" font-size="13" fill="#222222" text-anchor="middle">~$0.01 (media only)</text>
  <text x="893" y="655" font-size="13" fill="#222222" text-anchor="middle">30 TB per cartridge</text>
  <line x1="20" y1="363" x2="975" y2="363" stroke="#D55E00" stroke-width="2.5" stroke-dasharray="8 5"/>
  <rect x="505" y="351" width="300" height="24" rx="4" fill="#FFFFFF" stroke="#D55E00"/>
  <text x="655" y="368" font-size="13" font-weight="700" fill="#D55E00" text-anchor="middle">≈1,000× latency jump: memory–storage wall</text>
  <text x="975" y="355" font-size="12" fill="#D55E00" text-anchor="end">↑ byte-addressable, volatile</text>
  <text x="975" y="381" font-size="12" fill="#D55E00" text-anchor="end">↓ block-addressed, persistent</text>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
  <line x1="22" y1="140" x2="22" y2="333" stroke="#555555" stroke-width="1.5" marker-start="url(#ah)"/>
  <text x="0" y="0" font-size="12" fill="#555555" text-anchor="middle" transform="translate(14,236) rotate(-90)">faster, costlier per GB</text>
  <line x1="22" y1="393" x2="22" y2="674" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="0" y="0" font-size="12" fill="#555555" text-anchor="middle" transform="translate(14,534) rotate(-90)">bigger, cheaper per GB</text>
  <text x="30" y="716" font-size="12" fill="#555555">Latency = typical device access, excluding queueing. Networked flash = local flash + fabric (~5–15 µs) + storage software. Tape = load and locate.</text>
  <text x="30" y="734" font-size="12" fill="#555555">$/GB: HBM and DRAM are 2026 contract levels during a shortage; SSD range spans QLC to TLC; tape excludes drives and library.</text>
</svg>
