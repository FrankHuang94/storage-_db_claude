<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" role="img" aria-labelledby="t d" font-family="Inter, Helvetica, Arial, sans-serif">
  <title id="t">S3 GET over HTTP/TCP versus S3 GET with RDMA</title>
  <desc id="d">Top panel: a conventional S3 GET. Object bytes leave the storage server's media, are copied through the gateway process and the server's kernel TCP stack, cross the network, land in the client's kernel socket buffers, are copied into a user-space buffer in host DRAM, and are finally copied into GPU memory. Both CPUs touch every byte. Bottom panel: S3 with RDMA. A small signed HTTP request carries an RDMA token describing a registered GPU or host buffer. The storage server's RDMA NIC moves the object bytes directly into that buffer, over RoCE or InfiniBand, using GPUDirect RDMA across PCIe on the client. The HTTP response only confirms completion.</desc>
  <rect x="0" y="0" width="1000" height="640" fill="#FFFFFF"/>

  <text x="30" y="34" font-size="20" font-weight="700" fill="#222222">One S3 GET, two data paths</text>
  <text x="30" y="56" font-size="13" fill="#555555">Logical view, not to scale. Original drawing for the Everpure Tech Atlas, Chapter 9.</text>

  <!-- ================= Panel A: HTTP/TCP ================= -->
  <text x="30" y="92" font-size="15" font-weight="700" fill="#222222">A. Classic S3 over HTTP/TCP: control and data share one byte stream</text>

  <!-- Client column -->
  <rect x="30" y="104" width="420" height="200" rx="8" fill="#F3F6F9" stroke="#888888"/>
  <text x="44" y="124" font-size="13" font-weight="700" fill="#222222">GPU server (client)</text>
  <rect x="44" y="136" width="120" height="50" rx="6" fill="#56B4E9"/>
  <text x="104" y="158" font-size="13" text-anchor="middle" fill="#222222">GPU memory</text>
  <text x="104" y="175" font-size="12" text-anchor="middle" fill="#222222">(HBM)</text>
  <rect x="186" y="136" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#888888"/>
  <text x="246" y="158" font-size="13" text-anchor="middle" fill="#222222">User buffer</text>
  <text x="246" y="175" font-size="12" text-anchor="middle" fill="#222222">host DRAM</text>
  <rect x="186" y="230" width="120" height="58" rx="6" fill="#FFFFFF" stroke="#888888"/>
  <text x="246" y="252" font-size="13" text-anchor="middle" fill="#222222">Kernel TCP</text>
  <text x="246" y="269" font-size="12" text-anchor="middle" fill="#222222">socket buffers</text>
  <rect x="330" y="230" width="104" height="58" rx="6" fill="#999999"/>
  <text x="382" y="264" font-size="13" text-anchor="middle" fill="#FFFFFF">NIC</text>

  <!-- copies on client -->
  <g stroke="#D55E00" stroke-width="2.5" fill="none">
    <line x1="330" y1="259" x2="310" y2="259"/>
    <line x1="246" y1="230" x2="246" y2="190"/>
    <line x1="186" y1="161" x2="168" y2="161"/>
  </g>
  <circle cx="262" cy="210" r="11" fill="#D55E00"/><text x="262" y="214" font-size="12" text-anchor="middle" fill="#FFFFFF" font-weight="700">2</text>
  <circle cx="177" cy="200" r="11" fill="#D55E00"/><text x="177" y="204" font-size="12" text-anchor="middle" fill="#FFFFFF" font-weight="700">3</text>
  <text x="44" y="214" font-size="12" fill="#555555">CPU copies,</text>
  <text x="44" y="230" font-size="12" fill="#555555">checksums, parses</text>
  <text x="44" y="246" font-size="12" fill="#555555">HTTP framing</text>

  <!-- Network -->
  <rect x="456" y="236" width="88" height="46" rx="6" fill="#DDDDDD"/>
  <text x="500" y="256" font-size="12" text-anchor="middle" fill="#222222">Ethernet</text>
  <text x="500" y="272" font-size="12" text-anchor="middle" fill="#222222">TCP</text>
  <line x1="434" y1="259" x2="456" y2="259" stroke="#D55E00" stroke-width="2.5"/>
  <line x1="544" y1="259" x2="566" y2="259" stroke="#D55E00" stroke-width="2.5"/>

  <!-- Server column -->
  <rect x="550" y="104" width="420" height="200" rx="8" fill="#F3F6F9" stroke="#888888"/>
  <text x="564" y="124" font-size="13" font-weight="700" fill="#222222">Object storage server</text>
  <rect x="566" y="230" width="104" height="58" rx="6" fill="#999999"/>
  <text x="618" y="264" font-size="13" text-anchor="middle" fill="#FFFFFF">NIC</text>
  <rect x="692" y="230" width="120" height="58" rx="6" fill="#FFFFFF" stroke="#888888"/>
  <text x="752" y="252" font-size="13" text-anchor="middle" fill="#222222">Kernel TCP</text>
  <text x="752" y="269" font-size="12" text-anchor="middle" fill="#222222">+ TLS</text>
  <rect x="692" y="136" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#888888"/>
  <text x="752" y="158" font-size="13" text-anchor="middle" fill="#222222">S3 gateway</text>
  <text x="752" y="175" font-size="12" text-anchor="middle" fill="#222222">auth + HTTP</text>
  <rect x="834" y="136" width="120" height="50" rx="6" fill="#0072B2"/>
  <text x="894" y="158" font-size="13" text-anchor="middle" fill="#FFFFFF">Flash media</text>
  <text x="894" y="175" font-size="12" text-anchor="middle" fill="#FFFFFF">+ metadata</text>
  <g stroke="#D55E00" stroke-width="2.5" fill="none">
    <line x1="834" y1="161" x2="816" y2="161"/>
    <line x1="752" y1="190" x2="752" y2="230"/>
    <line x1="692" y1="259" x2="674" y2="259"/>
  </g>
  <circle cx="768" cy="210" r="11" fill="#D55E00"/><text x="768" y="214" font-size="12" text-anchor="middle" fill="#FFFFFF" font-weight="700">1</text>
  <text x="834" y="214" font-size="12" fill="#555555">Server CPU also</text>
  <text x="834" y="230" font-size="12" fill="#555555">touches every byte</text>

  <text x="30" y="326" font-size="13" fill="#222222">Bytes are copied through kernel and user buffers on both sides and both CPUs touch them; per-node throughput hits a CPU and DRAM wall.</text>

  <!-- ================= Panel B: RDMA ================= -->
  <text x="30" y="370" font-size="15" font-weight="700" fill="#222222">B. S3 with RDMA: HTTP carries the request and token; the NIC moves the bytes</text>

  <rect x="30" y="382" width="420" height="200" rx="8" fill="#F3F6F9" stroke="#888888"/>
  <text x="44" y="402" font-size="13" font-weight="700" fill="#222222">GPU server (client)</text>
  <rect x="44" y="414" width="120" height="50" rx="6" fill="#56B4E9"/>
  <text x="104" y="436" font-size="13" text-anchor="middle" fill="#222222">GPU memory</text>
  <text x="104" y="453" font-size="12" text-anchor="middle" fill="#222222">registered</text>
  <rect x="186" y="414" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#888888"/>
  <text x="266" y="436" font-size="13" text-anchor="middle" fill="#222222">S3 client library</text>
  <text x="266" y="453" font-size="12" text-anchor="middle" fill="#222222">signs request + token</text>
  <rect x="330" y="508" width="104" height="58" rx="6" fill="#009E73"/>
  <text x="382" y="535" font-size="13" text-anchor="middle" fill="#FFFFFF">RDMA NIC</text>
  <text x="382" y="552" font-size="12" text-anchor="middle" fill="#FFFFFF">(RNIC)</text>
  <!-- PCIe peer-to-peer path -->
  <path d="M330 537 L104 537 L104 468" stroke="#009E73" stroke-width="4" fill="none"/>
  <text x="114" y="498" font-size="12" fill="#222222">GPUDirect RDMA over PCIe, no bounce buffer</text>

  <rect x="456" y="514" width="88" height="46" rx="6" fill="#DDDDDD"/>
  <text x="500" y="534" font-size="12" text-anchor="middle" fill="#222222">RoCE or</text>
  <text x="500" y="550" font-size="12" text-anchor="middle" fill="#222222">InfiniBand</text>
  <line x1="434" y1="537" x2="456" y2="537" stroke="#009E73" stroke-width="4"/>
  <line x1="544" y1="537" x2="566" y2="537" stroke="#009E73" stroke-width="4"/>

  <rect x="550" y="382" width="420" height="200" rx="8" fill="#F3F6F9" stroke="#888888"/>
  <text x="564" y="402" font-size="13" font-weight="700" fill="#222222">Object storage server</text>
  <rect x="566" y="508" width="104" height="58" rx="6" fill="#009E73"/>
  <text x="618" y="535" font-size="13" text-anchor="middle" fill="#FFFFFF">RDMA NIC</text>
  <text x="618" y="552" font-size="12" text-anchor="middle" fill="#FFFFFF">(RNIC)</text>
  <rect x="692" y="414" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#888888"/>
  <text x="752" y="436" font-size="13" text-anchor="middle" fill="#222222">S3 gateway</text>
  <text x="752" y="453" font-size="12" text-anchor="middle" fill="#222222">auth + RDMA lib</text>
  <rect x="834" y="414" width="120" height="50" rx="6" fill="#0072B2"/>
  <text x="894" y="436" font-size="13" text-anchor="middle" fill="#FFFFFF">Flash media</text>
  <text x="894" y="453" font-size="12" text-anchor="middle" fill="#FFFFFF">+ metadata</text>
  <path d="M894 468 L894 537 L674 537" stroke="#009E73" stroke-width="4" fill="none"/>
  <text x="690" y="498" font-size="12" fill="#222222">data staged once, NIC DMA</text>

  <!-- control path: dashed -->
  <line x1="346" y1="430" x2="688" y2="430" stroke="#222222" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="500" y="422" font-size="12" fill="#222222" text-anchor="middle">signed HTTP GET + RDMA token</text>
  <line x1="688" y1="448" x2="346" y2="448" stroke="#222222" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="500" y="466" font-size="12" fill="#222222" text-anchor="middle">small 200 OK reply</text>
  <line x1="752" y1="468" x2="752" y2="482" stroke="#222222" stroke-width="1.6" stroke-dasharray="6 4"/>

  <text x="30" y="604" font-size="13" fill="#222222">Auth, policy and metadata stay on the familiar S3 control path; bulk bytes skip both kernels and the client CPU.</text>
  <text x="30" y="624" font-size="12" fill="#555555">Legend: orange = CPU-mediated copies; green = RDMA/DMA data path; dashed = HTTP control messages.</text>
</svg>
