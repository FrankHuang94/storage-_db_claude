<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>Traditional bounce-buffer path versus GPUDirect path from storage to GPU memory</title>
  <defs>
    <marker id="arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777777"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#FFFFFF"/>

  <!-- Divider -->
  <line x1="500" y1="20" x2="500" y2="620" stroke="#DDDDDD" stroke-width="2"/>

  <!-- ===================== Panel A: traditional ===================== -->
  <text x="30" y="40" font-size="18" font-weight="bold" fill="#222222">A. Traditional path: bounce buffer</text>
  <text x="30" y="62" font-size="13" fill="#555555">POSIX read() into host memory, then cudaMemcpy to the GPU</text>

  <rect x="40" y="85" width="170" height="64" rx="6" fill="#FDE7D9" stroke="#D55E00" stroke-width="2"/>
  <text x="125" y="112" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">Host DRAM</text>
  <text x="125" y="132" font-size="12" fill="#222222" text-anchor="middle">bounce buffer / page cache</text>

  <rect x="270" y="85" width="190" height="64" rx="6" fill="#F2F2F2" stroke="#222222" stroke-width="1.5"/>
  <text x="365" y="112" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">CPU</text>
  <text x="365" y="132" font-size="12" fill="#222222" text-anchor="middle">PCIe root complex, copies</text>

  <rect x="150" y="225" width="200" height="50" rx="6" fill="#F2F2F2" stroke="#222222" stroke-width="1.5"/>
  <text x="250" y="255" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">PCIe switch</text>

  <rect x="40" y="340" width="170" height="60" rx="6" fill="#E6F0F8" stroke="#222222" stroke-width="1.5"/>
  <text x="125" y="366" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">RDMA NIC</text>
  <text x="125" y="386" font-size="12" fill="#222222" text-anchor="middle">or local NVMe SSD</text>

  <rect x="290" y="340" width="170" height="60" rx="6" fill="#E3F4EE" stroke="#009E73" stroke-width="2"/>
  <text x="375" y="366" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">GPU</text>
  <text x="375" y="386" font-size="12" fill="#222222" text-anchor="middle">HBM (destination)</text>

  <rect x="40" y="455" width="170" height="56" rx="6" fill="#F2F2F2" stroke="#222222" stroke-width="1.5"/>
  <text x="125" y="479" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Storage system</text>
  <text x="125" y="498" font-size="12" fill="#222222" text-anchor="middle">over the storage fabric</text>

  <!-- Data path A -->
  <line x1="125" y1="455" x2="125" y2="404" stroke="#D55E00" stroke-width="4" marker-end="url(#arV)"/>
  <line x1="140" y1="340" x2="200" y2="279" stroke="#D55E00" stroke-width="4" marker-end="url(#arV)"/>
  <line x1="230" y1="225" x2="310" y2="153" stroke="#D55E00" stroke-width="4" marker-end="url(#arV)"/>
  <line x1="270" y1="104" x2="214" y2="104" stroke="#D55E00" stroke-width="4" marker-end="url(#arV)"/>
  <line x1="210" y1="132" x2="266" y2="132" stroke="#D55E00" stroke-width="4" marker-end="url(#arV)"/>
  <line x1="400" y1="149" x2="310" y2="221" stroke="#D55E00" stroke-width="4" marker-end="url(#arV)"/>
  <line x1="310" y1="275" x2="360" y2="336" stroke="#D55E00" stroke-width="4" marker-end="url(#arV)"/>

  <!-- Step badges A -->
  <circle cx="100" cy="428" r="12" fill="#D55E00"/><text x="100" y="433" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="240" cy="180" r="12" fill="#D55E00"/><text x="240" y="185" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="242" y="98" font-size="12" fill="#D55E00" text-anchor="middle">write</text>
  <text x="240" y="150" font-size="12" fill="#D55E00" text-anchor="middle">read</text>
  <circle cx="380" cy="195" r="12" fill="#D55E00"/><text x="380" y="200" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>

  <text x="30" y="548" font-size="13" fill="#222222"><tspan font-weight="bold" fill="#D55E00">1</tspan> data arrives at the NIC   <tspan font-weight="bold" fill="#D55E00">2</tspan> DMA into host DRAM (copy 1)</text>
  <text x="30" y="568" font-size="13" fill="#222222"><tspan font-weight="bold" fill="#D55E00">3</tspan> DMA from DRAM to GPU HBM (copy 2)</text>
  <text x="30" y="592" font-size="13" fill="#222222">Every byte crosses host memory twice; the CPU pins,</text>
  <text x="30" y="610" font-size="13" fill="#222222">copies and caches it. Cross-socket layouts add a hop.</text>

  <!-- ===================== Panel B: GPU-direct ===================== -->
  <text x="530" y="40" font-size="18" font-weight="bold" fill="#222222">B. GPUDirect Storage / RDMA path</text>
  <text x="530" y="62" font-size="13" fill="#555555">cuFileRead() names a GPU buffer; the NIC writes it directly</text>

  <rect x="540" y="85" width="170" height="64" rx="6" fill="#F7F7F7" stroke="#BBBBBB" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="625" y="112" font-size="15" font-weight="bold" fill="#999999" text-anchor="middle">Host DRAM</text>
  <text x="625" y="132" font-size="12" fill="#999999" text-anchor="middle">not on the data path</text>

  <rect x="770" y="85" width="190" height="64" rx="6" fill="#F2F2F2" stroke="#222222" stroke-width="1.5"/>
  <text x="865" y="112" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">CPU</text>
  <text x="865" y="132" font-size="12" fill="#222222" text-anchor="middle">issues I/O, sets up DMA</text>

  <rect x="650" y="225" width="200" height="50" rx="6" fill="#F2F2F2" stroke="#222222" stroke-width="1.5"/>
  <text x="750" y="255" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">PCIe switch</text>

  <rect x="540" y="340" width="170" height="60" rx="6" fill="#E6F0F8" stroke="#222222" stroke-width="1.5"/>
  <text x="625" y="366" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">RDMA NIC</text>
  <text x="625" y="386" font-size="12" fill="#222222" text-anchor="middle">or local NVMe SSD</text>

  <rect x="790" y="340" width="170" height="60" rx="6" fill="#E3F4EE" stroke="#009E73" stroke-width="2"/>
  <text x="875" y="366" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">GPU</text>
  <text x="875" y="386" font-size="12" fill="#222222" text-anchor="middle">HBM (destination)</text>

  <rect x="540" y="455" width="170" height="56" rx="6" fill="#F2F2F2" stroke="#222222" stroke-width="1.5"/>
  <text x="625" y="479" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Storage system</text>
  <text x="625" y="498" font-size="12" fill="#222222" text-anchor="middle">over the storage fabric</text>

  <!-- Data path B -->
  <line x1="625" y1="455" x2="625" y2="404" stroke="#0072B2" stroke-width="4" marker-end="url(#arB)"/>
  <path d="M640,340 L700,279 Q750,262 800,279 L855,336" fill="none" stroke="#0072B2" stroke-width="4" marker-end="url(#arB)"/>
  <circle cx="600" cy="428" r="12" fill="#0072B2"/><text x="600" y="433" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="750" cy="300" r="12" fill="#0072B2"/><text x="750" y="305" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="750" y="330" font-size="12" fill="#0072B2" text-anchor="middle">peer-to-peer DMA</text>

  <!-- Control path B -->
  <path d="M930,149 L930,336" fill="none" stroke="#777777" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arG)"/>
  <path d="M775,149 L700,336" fill="none" stroke="#777777" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arG)"/>
  <text x="940" y="200" font-size="12" fill="#555555">control</text>
  <text x="940" y="216" font-size="12" fill="#555555">only</text>

  <text x="530" y="548" font-size="13" fill="#222222"><tspan font-weight="bold" fill="#0072B2">1</tspan> data arrives at the NIC   <tspan font-weight="bold" fill="#0072B2">2</tspan> NIC DMAs into GPU HBM</text>
  <text x="530" y="568" font-size="13" fill="#222222">through the PCIe switch, one copy, no host DRAM.</text>
  <text x="530" y="592" font-size="13" fill="#222222">Works best when NIC and GPU share a PCIe switch;</text>
  <text x="530" y="610" font-size="13" fill="#222222">unsupported setups fall back to the bounce buffer.</text>
</svg>
