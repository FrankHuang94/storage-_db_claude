<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" role="img" aria-labelledby="t d" font-family="Inter, Helvetica, Arial, sans-serif">
  <title id="t">Two ways to compute data placement: a consistent-hashing ring and CRUSH</title>
  <desc id="d">Left panel: a consistent-hashing ring. Nodes A, B, C and D sit at points on a circle; each key is hashed to a point and stored on the next node clockwise. When node E is added between B and C, only the keys on the arc from B to E move, from C to E; every other key stays where it was. Right panel: Ceph-style CRUSH. An object name is hashed into a placement group, and the CRUSH function walks a hierarchy of root, racks, hosts and drives using a rule such as three replicas on hosts in three different racks, returning an ordered list of drives whose first entry is the primary.</desc>
  <rect x="0" y="0" width="1000" height="600" fill="#FFFFFF"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#222222">Placement is computed, not looked up</text>
  <text x="30" y="58" font-size="13" fill="#555555">Original drawing for the Everpure Tech Atlas, Chapter 15. Simplified; real systems use many virtual points per node.</text>

  <!-- Left panel: ring -->
  <text x="250" y="96" font-size="15" font-weight="700" text-anchor="middle" fill="#222222">A. Consistent-hashing ring</text>
  <circle cx="250" cy="330" r="150" fill="none" stroke="#888888" stroke-width="3"/>
  <path d="M 400 330 A 150 150 0 0 1 356 436" fill="none" stroke="#D55E00" stroke-width="9" stroke-linecap="round"/>
  <!-- nodes -->
  <g font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">
    <circle cx="250" cy="180" r="20" fill="#0072B2"/><text x="250" y="185">A</text>
    <circle cx="400" cy="330" r="20" fill="#0072B2"/><text x="400" y="335">B</text>
    <circle cx="250" cy="480" r="20" fill="#0072B2"/><text x="250" y="485">C</text>
    <circle cx="100" cy="330" r="20" fill="#0072B2"/><text x="100" y="335">D</text>
    <circle cx="356" cy="436" r="20" fill="#009E73"/><text x="356" y="441">E</text>
  </g>
  <!-- keys -->
  <g fill="#222222">
    <rect x="350" y="218" width="12" height="12"/><rect x="374" y="399" width="12" height="12"/>
    <rect x="193" y="465" width="12" height="12"/><rect x="114" y="249" width="12" height="12"/>
  </g>
  <g font-size="12" fill="#222222">
    <text x="368" y="214">key k1 → B</text>
    <text x="392" y="404">k2 → E (was C)</text>
    <text x="120" y="500">k3 → D</text>
    <text x="40" y="236">k4 → A</text>
  </g>
  <text x="250" y="322" font-size="12" text-anchor="middle" fill="#555555">hash(key) picks a point;</text>
  <text x="250" y="338" font-size="12" text-anchor="middle" fill="#555555">data lives on the next</text>
  <text x="250" y="354" font-size="12" text-anchor="middle" fill="#555555">node clockwise</text>
  <rect x="40" y="530" width="420" height="50" rx="6" fill="#FBE3D6"/>
  <text x="250" y="551" font-size="13" text-anchor="middle" fill="#222222">Adding node E moves only the orange arc (≈1/5 of keys)</text>
  <text x="250" y="569" font-size="13" text-anchor="middle" fill="#222222">versus ≈4/5 with naive hash-mod-N placement.</text>

  <!-- divider -->
  <line x1="490" y1="84" x2="490" y2="584" stroke="#DDDDDD" stroke-width="2"/>

  <!-- Right panel: CRUSH -->
  <text x="745" y="96" font-size="15" font-weight="700" text-anchor="middle" fill="#222222">B. CRUSH-style hierarchical placement</text>
  <rect x="520" y="112" width="140" height="34" rx="5" fill="#F3F6F9" stroke="#888888"/>
  <text x="590" y="134" font-size="13" text-anchor="middle" fill="#222222">object "ckpt-0042"</text>
  <line x1="660" y1="129" x2="690" y2="129" stroke="#222222" stroke-width="1.5"/>
  <text x="675" y="122" font-size="12" text-anchor="middle" fill="#555555">hash</text>
  <rect x="690" y="112" width="110" height="34" rx="5" fill="#56B4E9"/>
  <text x="745" y="134" font-size="13" text-anchor="middle" fill="#222222">PG 7.1a</text>
  <line x1="800" y1="129" x2="830" y2="129" stroke="#222222" stroke-width="1.5"/>
  <rect x="830" y="104" width="150" height="50" rx="5" fill="#F0E442"/>
  <text x="905" y="125" font-size="12" text-anchor="middle" fill="#222222">rule: 3 copies,</text>
  <text x="905" y="141" font-size="12" text-anchor="middle" fill="#222222">each in a different rack</text>

  <!-- hierarchy -->
  <rect x="695" y="182" width="100" height="30" rx="5" fill="#222222"/>
  <text x="745" y="202" font-size="13" text-anchor="middle" fill="#FFFFFF">root</text>
  <g stroke="#888888" stroke-width="1.5">
    <line x1="745" y1="212" x2="580" y2="252"/><line x1="745" y1="212" x2="745" y2="252"/><line x1="745" y1="212" x2="910" y2="252"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <rect x="530" y="252" width="100" height="30" rx="5" fill="#0072B2"/><text x="580" y="272" fill="#FFFFFF">rack 1</text>
    <rect x="695" y="252" width="100" height="30" rx="5" fill="#0072B2"/><text x="745" y="272" fill="#FFFFFF">rack 2</text>
    <rect x="860" y="252" width="100" height="30" rx="5" fill="#0072B2"/><text x="910" y="272" fill="#FFFFFF">rack 3</text>
  </g>
  <g stroke="#888888" stroke-width="1.5">
    <line x1="580" y1="282" x2="545" y2="320"/><line x1="580" y1="282" x2="615" y2="320"/>
    <line x1="745" y1="282" x2="710" y2="320"/><line x1="745" y1="282" x2="780" y2="320"/>
    <line x1="910" y1="282" x2="875" y2="320"/><line x1="910" y1="282" x2="945" y2="320"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#222222">
    <rect x="515" y="320" width="60" height="28" rx="4" fill="#E8F1F8" stroke="#0072B2"/><text x="545" y="339">host 1</text>
    <rect x="585" y="320" width="60" height="28" rx="4" fill="#E8F1F8" stroke="#0072B2"/><text x="615" y="339">host 2</text>
    <rect x="680" y="320" width="60" height="28" rx="4" fill="#E8F1F8" stroke="#0072B2"/><text x="710" y="339">host 3</text>
    <rect x="750" y="320" width="60" height="28" rx="4" fill="#E8F1F8" stroke="#0072B2"/><text x="780" y="339">host 4</text>
    <rect x="845" y="320" width="60" height="28" rx="4" fill="#E8F1F8" stroke="#0072B2"/><text x="875" y="339">host 5</text>
    <rect x="915" y="320" width="60" height="28" rx="4" fill="#E8F1F8" stroke="#0072B2"/><text x="945" y="339">host 6</text>
  </g>
  <g stroke="#888888" stroke-width="1.2">
    <line x1="615" y1="348" x2="615" y2="380"/><line x1="710" y1="348" x2="710" y2="380"/><line x1="945" y1="348" x2="945" y2="380"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <rect x="580" y="380" width="70" height="28" rx="4" fill="#D55E00"/><text x="615" y="399" fill="#FFFFFF">drive 4</text>
    <rect x="675" y="380" width="70" height="28" rx="4" fill="#009E73"/><text x="710" y="399" fill="#FFFFFF">drive 12</text>
    <rect x="910" y="380" width="70" height="28" rx="4" fill="#009E73"/><text x="945" y="399" fill="#FFFFFF">drive 27</text>
  </g>
  <text x="615" y="426" font-size="12" text-anchor="middle" fill="#222222">primary</text>
  <text x="710" y="426" font-size="12" text-anchor="middle" fill="#222222">replica</text>
  <text x="945" y="426" font-size="12" text-anchor="middle" fill="#222222">replica</text>

  <rect x="510" y="450" width="470" height="130" rx="6" fill="#F3F6F9"/>
  <text x="525" y="474" font-size="13" fill="#222222">CRUSH(PG, cluster map, rule) → [drive 4, drive 12, drive 27]</text>
  <text x="525" y="498" font-size="13" fill="#222222">• Any client or node computes the same answer from the same map.</text>
  <text x="525" y="520" font-size="13" fill="#222222">• The rule encodes failure domains (host, rack, row, room).</text>
  <text x="525" y="542" font-size="13" fill="#222222">• Placement groups batch millions of objects into a few thousand</text>
  <text x="525" y="562" font-size="13" fill="#222222">   units, so rebalancing moves whole PGs, not single objects.</text>
</svg>
