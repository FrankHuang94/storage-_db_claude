<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" role="img" aria-labelledby="t d" font-family="Inter, Helvetica, Arial, sans-serif">
  <title id="t">Object storage cluster: gateways, index, data nodes and background services</title>
  <desc id="d">S3 clients reach a load balancer that spreads requests over a row of stateless S3 gateway nodes. Gateways consult an identity and policy service, look up and commit object records in a sharded, replicated metadata index, and stream erasure-coded fragments to many data nodes spread over failure domains. Background services for erasure-code conversion and rebuild, scrubbing, lifecycle and garbage collection, and cross-site replication work on the index and the data nodes off the request path.</desc>
  <rect x="0" y="0" width="1000" height="640" fill="#FFFFFF"/>

  <text x="30" y="36" font-size="20" font-weight="700" fill="#222222">Inside an object store: three planes plus background services</text>
  <text x="30" y="58" font-size="13" fill="#555555">Logical view, not to scale. Original drawing for the Everpure Tech Atlas, Chapter 18.</text>

  <!-- Clients -->
  <rect x="30" y="74" width="940" height="40" rx="6" fill="#F3F6F9" stroke="#888888"/>
  <text x="500" y="99" font-size="14" text-anchor="middle" fill="#222222">S3 clients: SDKs, data loaders, backup software, lakehouse engines (HTTPS, optionally RDMA for bulk bytes)</text>

  <!-- Load balancer -->
  <rect x="300" y="126" width="400" height="30" rx="4" fill="#DDDDDD"/>
  <text x="500" y="146" font-size="13" text-anchor="middle" fill="#222222">Load balancer / DNS round-robin: any request to any gateway</text>

  <!-- Gateways -->
  <g font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <rect x="160" y="172" width="120" height="58" rx="6" fill="#0072B2"/><text x="220" y="197">S3 gateway</text>
    <rect x="300" y="172" width="120" height="58" rx="6" fill="#0072B2"/><text x="360" y="197">S3 gateway</text>
    <rect x="440" y="172" width="120" height="58" rx="6" fill="#0072B2"/><text x="500" y="197">S3 gateway</text>
    <rect x="580" y="172" width="120" height="58" rx="6" fill="#0072B2"/><text x="640" y="197">S3 gateway</text>
    <rect x="720" y="172" width="120" height="58" rx="6" fill="#0072B2"/><text x="780" y="197">S3 gateway</text>
  </g>
  <g font-size="12" fill="#FFFFFF" text-anchor="middle">
    <text x="220" y="216">stateless</text><text x="360" y="216">stateless</text><text x="500" y="216">stateless</text><text x="640" y="216">stateless</text><text x="780" y="216">stateless</text>
  </g>
  <text x="30" y="196" font-size="13" font-weight="700" fill="#0072B2">Front end</text>
  <text x="30" y="214" font-size="12" fill="#555555">SigV4, routing,</text>
  <text x="30" y="229" font-size="12" fill="#555555">EC encode/decode</text>

  <!-- IAM box -->
  <rect x="860" y="172" width="110" height="58" rx="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.5"/>
  <text x="915" y="196" font-size="12" font-weight="700" text-anchor="middle" fill="#222222">Identity and</text>
  <text x="915" y="213" font-size="12" font-weight="700" text-anchor="middle" fill="#222222">policy</text>
  <line x1="840" y1="201" x2="860" y2="201" stroke="#0072B2" stroke-width="1.5"/>

  <!-- Arrows from gateways down -->
  <g stroke="#555555" stroke-width="1.6" fill="none">
    <line x1="300" y1="232" x2="230" y2="290"/>
    <line x1="500" y1="232" x2="300" y2="290"/>
    <line x1="500" y1="232" x2="700" y2="290"/>
    <line x1="700" y1="232" x2="770" y2="290"/>
  </g>
  <text x="140" y="268" font-size="12" fill="#555555">lookup / commit</text>
  <text x="756" y="268" font-size="12" fill="#555555">fragments</text>

  <!-- Index plane -->
  <rect x="30" y="292" width="390" height="176" rx="8" fill="#FFF6E5" stroke="#E69F00" stroke-width="1.5"/>
  <text x="50" y="318" font-size="15" font-weight="700" fill="#222222">Metadata / index plane</text>
  <text x="50" y="338" font-size="12" fill="#555555">bucket + key + version → ETag, size, fragment map</text>
  <g font-size="12" text-anchor="middle" fill="#222222">
    <rect x="50" y="352" width="80" height="44" rx="4" fill="#FFFFFF" stroke="#E69F00"/><text x="90" y="372">shard A</text><text x="90" y="388">3 replicas</text>
    <rect x="140" y="352" width="80" height="44" rx="4" fill="#FFFFFF" stroke="#E69F00"/><text x="180" y="372">shard B</text><text x="180" y="388">3 replicas</text>
    <rect x="230" y="352" width="80" height="44" rx="4" fill="#FFFFFF" stroke="#E69F00"/><text x="270" y="372">shard C</text><text x="270" y="388">3 replicas</text>
    <rect x="320" y="352" width="80" height="44" rx="4" fill="#FFFFFF" stroke="#E69F00"/><text x="360" y="372">shard …</text><text x="360" y="388">3 replicas</text>
  </g>
  <text x="50" y="420" font-size="12" fill="#222222">Sorted by key, so LIST is a range scan.</text>
  <text x="50" y="438" font-size="12" fill="#222222">Sharded by key range or hash; lives on flash.</text>
  <text x="50" y="456" font-size="12" fill="#222222">Hash-placed designs (MinIO) keep it beside data.</text>

  <!-- Data plane -->
  <rect x="440" y="292" width="530" height="176" rx="8" fill="#E8F5F0" stroke="#009E73" stroke-width="1.5"/>
  <text x="460" y="318" font-size="15" font-weight="700" fill="#222222">Data plane: storage nodes</text>
  <text x="460" y="338" font-size="12" fill="#555555">each node = CPU + many drives; holds fragments, not whole objects</text>
  <g font-size="12" text-anchor="middle" fill="#FFFFFF">
    <rect x="460" y="352" width="70" height="60" rx="4" fill="#009E73"/><text x="495" y="378">node 1</text><text x="495" y="396">rack 1</text>
    <rect x="545" y="352" width="70" height="60" rx="4" fill="#009E73"/><text x="580" y="378">node 2</text><text x="580" y="396">rack 2</text>
    <rect x="630" y="352" width="70" height="60" rx="4" fill="#009E73"/><text x="665" y="378">node 3</text><text x="665" y="396">rack 3</text>
    <rect x="715" y="352" width="70" height="60" rx="4" fill="#009E73"/><text x="750" y="378">node 4</text><text x="750" y="396">rack 4</text>
    <rect x="800" y="352" width="70" height="60" rx="4" fill="#009E73"/><text x="835" y="378">node 5</text><text x="835" y="396">rack 5</text>
    <rect x="885" y="352" width="70" height="60" rx="4" fill="#009E73"/><text x="920" y="378">node …</text><text x="920" y="396">rack …</text>
  </g>
  <text x="460" y="438" font-size="12" fill="#222222">One 8+4 stripe = 12 fragments on 12 nodes in different failure domains.</text>
  <text x="460" y="456" font-size="12" fill="#222222">Per-node engine (e.g., ShardStore at AWS) maps fragments to drive extents.</text>

  <!-- Background services -->
  <rect x="30" y="488" width="940" height="118" rx="8" fill="#F7EEF4" stroke="#CC79A7" stroke-width="1.5"/>
  <text x="50" y="514" font-size="15" font-weight="700" fill="#222222">Background services (off the request path, but they consume the same drives and network)</text>
  <g font-size="12" text-anchor="middle" fill="#222222">
    <rect x="50" y="528" width="170" height="60" rx="4" fill="#FFFFFF" stroke="#CC79A7"/><text x="135" y="552">EC conversion and</text><text x="135" y="570">rebuild of lost fragments</text>
    <rect x="235" y="528" width="170" height="60" rx="4" fill="#FFFFFF" stroke="#CC79A7"/><text x="320" y="552">Scrubbing: re-read and</text><text x="320" y="570">checksum to catch bit rot</text>
    <rect x="420" y="528" width="170" height="60" rx="4" fill="#FFFFFF" stroke="#CC79A7"/><text x="505" y="552">Lifecycle: expire, tier,</text><text x="505" y="570">delete old versions</text>
    <rect x="605" y="528" width="170" height="60" rx="4" fill="#FFFFFF" stroke="#CC79A7"/><text x="690" y="552">Garbage collection and</text><text x="690" y="570">index compaction</text>
    <rect x="790" y="528" width="160" height="60" rx="4" fill="#FFFFFF" stroke="#CC79A7"/><text x="870" y="552">Replication to</text><text x="870" y="570">other sites</text>
  </g>
  <text x="30" y="628" font-size="12" fill="#555555">Scale gateways for request rate, index shards for object count and LIST, data nodes for capacity and bandwidth.</text>
</svg>
