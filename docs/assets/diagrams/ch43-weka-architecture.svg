<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" role="img" aria-labelledby="t d" font-family="Inter, Helvetica, Arial, sans-serif">
<title id="t">WEKA NeuralMesh logical architecture</title>
<desc id="d">Clients with the WEKA agent and protocol gateways reach a shared-nothing backend cluster over a DPDK fabric; each backend server runs compute processes holding metadata buckets, drive processes doing user-space NVMe I/O, and a management process; cold data tiers to an S3-compatible object store.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="1000" height="620" fill="#FFFFFF"/>
<text x="20" y="32" font-size="18" font-weight="bold" fill="#222">WEKA NeuralMesh: logical architecture (dedicated mode shown)</text>
<rect x="20" y="50" width="720" height="120" rx="6" fill="#F5F5F5" stroke="#999"/>
<text x="30" y="68" font-size="13" font-weight="bold" fill="#222">Clients</text>
<rect x="35" y="75" width="250" height="88" rx="4" fill="#FFFFFF" stroke="#009E73" stroke-width="1.5"/>
<text x="45" y="93" font-size="13" font-weight="bold" fill="#222">GPU server (client)</text>
<text x="45" y="109" font-size="12" fill="#222">App: PyTorch, vLLM, Dynamo</text>
<text x="45" y="125" font-size="12" fill="#222">WEKA client: POSIX driver plus</text>
<text x="45" y="141" font-size="12" fill="#222">user-space frontend (DPDK)</text>
<rect x="300" y="75" width="250" height="88" rx="4" fill="#FFFFFF" stroke="#009E73" stroke-width="1.5"/>
<text x="310" y="93" font-size="13" font-weight="bold" fill="#222">GPU server (client)</text>
<text x="310" y="109" font-size="12" fill="#222">Frontend hashes each operation</text>
<text x="310" y="125" font-size="12" fill="#222">to the bucket that owns it</text>
<text x="310" y="141" font-size="12" fill="#222">GDS: DMA straight into GPU memory</text>
<rect x="565" y="75" width="165" height="88" rx="4" fill="#FFFFFF" stroke="#56B4E9" stroke-width="1.5"/>
<text x="575" y="93" font-size="13" font-weight="bold" fill="#222">Protocol gateways</text>
<text x="575" y="109" font-size="12" fill="#222">NFS, SMB, S3</text>
<text x="575" y="125" font-size="12" fill="#222">for clients without</text>
<text x="575" y="141" font-size="12" fill="#222">the WEKA agent</text>
<rect x="20" y="182" width="720" height="34" rx="4" fill="#EEEEEE" stroke="#999"/>
<text x="380" y="204" font-size="13" text-anchor="middle" fill="#222">Fabric: Ethernet or InfiniBand, DPDK user-space networking (UDP fallback), RDMA for GDS</text>
<line x1="160" y1="163" x2="160" y2="181" stroke="#555" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
<line x1="425" y1="163" x2="425" y2="181" stroke="#555" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
