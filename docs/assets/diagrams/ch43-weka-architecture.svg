<line x1="380" y1="479" x2="380" y2="499" stroke="#555" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
<rect x="20" y="500" width="720" height="62" rx="6" fill="#FFF4E5" stroke="#E69F00"/>
<text x="380" y="524" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Object tier: any S3-compatible store, on-premises or in a public cloud</text>
<text x="380" y="546" font-size="12" text-anchor="middle" fill="#222">Cold extents tier out of flash; snapshots can be pushed to object for backup or cloud bursting</text>
<rect x="760" y="50" width="225" height="512" rx="6" fill="#FAFAFA" stroke="#CCCCCC"/>
<text x="772" y="74" font-size="14" font-weight="bold" fill="#222">How the pieces fit</text>
<text x="772" y="100" font-size="13" font-weight="bold" fill="#009E73">Metadata</text>
<text x="772" y="118" font-size="12" fill="#222">Sharded into thousands of</text>
<text x="772" y="134" font-size="12" fill="#222">buckets spread over all</text>
<text x="772" y="150" font-size="12" fill="#222">compute processes. There is</text>
<text x="772" y="166" font-size="12" fill="#222">no dedicated metadata server.</text>
<text x="772" y="200" font-size="13" font-weight="bold" fill="#009E73">Data protection</text>
<text x="772" y="218" font-size="12" fill="#222">Distributed erasure coding:</text>
<text x="772" y="234" font-size="12" fill="#222">3 to 16 data plus 2 or 4</text>
<text x="772" y="250" font-size="12" fill="#222">parity strips, spread</text>
<text x="772" y="266" font-size="12" fill="#222">any-to-any across servers.</text>
<text x="772" y="300" font-size="13" font-weight="bold" fill="#009E73">Kernel bypass</text>
<text x="772" y="318" font-size="12" fill="#222">DPDK networking and a</text>
<text x="772" y="334" font-size="12" fill="#222">user-space NVMe path. In</text>
<text x="772" y="350" font-size="12" fill="#222">performance mode each</text>
<text x="772" y="366" font-size="12" fill="#222">process owns pinned cores.</text>
<text x="772" y="400" font-size="13" font-weight="bold" fill="#009E73">Deployment modes</text>
<text x="772" y="418" font-size="12" fill="#222">Dedicated: separate storage</text>
<text x="772" y="434" font-size="12" fill="#222">servers, as drawn here.</text>
<text x="772" y="450" font-size="12" fill="#222">Converged: backends run on</text>
<text x="772" y="466" font-size="12" fill="#222">GPU servers' local NVMe.</text>
<text x="772" y="482" font-size="12" fill="#222">Cloud: same software on</text>
<text x="772" y="498" font-size="12" fill="#222">AWS, Azure, GCP and OCI.</text>
<text x="20" y="588" font-size="12" fill="#555">Original drawing for the Everpure Tech Atlas, based on public WEKA documentation. Simplified: process counts per server,</text>
<text x="20" y="605" font-size="12" fill="#555">gateway placement and network layout vary by deployment and software release.</text>
</svg>
