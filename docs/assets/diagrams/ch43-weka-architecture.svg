<line x1="117" y1="217" x2="117" y2="259" stroke="#555" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
<line x1="295" y1="217" x2="295" y2="259" stroke="#555" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
<line x1="473" y1="217" x2="473" y2="259" stroke="#555" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
<line x1="651" y1="217" x2="651" y2="259" stroke="#555" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
<rect x="20" y="228" width="720" height="250" rx="6" fill="#F2FAF7" stroke="#009E73"/>
<text x="200" y="246" font-size="13" font-weight="bold" fill="#222">Backend cluster: shared-nothing, every server runs the same services</text>
<rect x="35" y="260" width="165" height="205" rx="4" fill="#FFFFFF" stroke="#009E73" stroke-width="1.5"/>
<text x="45" y="278" font-size="13" font-weight="bold" fill="#222">Backend server 1</text>
