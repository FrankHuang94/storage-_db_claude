<text x="652" y="112" font-size="12.5" font-weight="700" fill="#D55E00">BUY OPTION (category)</text>
<rect x="820" y="92" width="168" height="30" fill="#F3F6F9" stroke="#DDDDDD"/>
<text x="828" y="112" font-size="12.5" font-weight="700" fill="#009E73">PARTNER OPTION</text>
