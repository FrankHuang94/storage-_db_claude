<text x="56" y="159" font-size="14" font-weight="700" fill="#222222">8  AI data platform</text>
<text x="56" y="177" font-size="14" font-weight="700" fill="#222222">and agents</text>
<text x="56" y="199" font-size="12" fill="#555555">pipelines, DBs, agent runtimes</text>
<circle cx="260" cy="156" r="7" fill="#FFFFFF" stroke="#E69F00" stroke-width="3"/>
<text x="274" y="160" font-size="12" fill="#222222" font-weight="700">Data Stream, GA June 2026</text>
<text x="274" y="178" font-size="12" fill="#222222">on NVIDIA AI Data Platform</text>
<text x="274" y="196" font-size="12" fill="#222222">No database or agent runtime</text>
<text x="476" y="160" font-size="12" fill="#222222">Storage-native services:</text>
<text x="476" y="178" font-size="12" fill="#222222">event triggers, ingest,</text>
<text x="476" y="196" font-size="12" fill="#222222">MCP access to data</text>
<text x="652" y="160" font-size="12" fill="#222222">Category: serverless DB,</text>
<text x="652" y="178" font-size="12" fill="#222222">table formats, data engines</text>
<text x="652" y="196" font-size="12" fill="#D55E00">e.g. Databricks–Neon ~$1B</text>
