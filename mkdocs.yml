site_name: Everpure Tech Atlas
site_description: A strategy-level knowledge base on storage, AI storage and the competitive landscape around Everpure (formerly Pure Storage).
site_url: https://frankhuang94.github.io/storage-_db_claude/
repo_url: https://github.com/FrankHuang94/storage-_db_claude
repo_name: storage-_db_claude
edit_uri: edit/claude/affectionate-gates-srw7gi/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Light mode

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/extra.css

